variables:
  IMAGE_NAME: "${DOMAIN_REGISTRY}/blog_system_fe:${CI_COMMIT_TAG}_${CI_COMMIT_SHORT_SHA}"
stages:
  - buildandpush
  - run

buildandpush:
  stage: buildandpush
  before_script:
    - echo "Logging into AWS ECR"
    - echo "$AWS_ACCESS_KEY_ID" | aws configure set aws_access_key_id -
    - echo "$AWS_SECRET_ACCESS_KEY" | aws configure set aws_secret_access_key -
    - aws ecr get-login-password --region ap-southeast-1 | docker login --username AWS --password-stdin ${DOMAIN_REGISTRY}
  script:
    - pwd
    - whoami
    - docker build -t blog_system .
    - docker tag blog_system:latest ${IMAGE_NAME}
    - docker push ${IMAGE_NAME}
  only:
    - tags
  tags:
    - ${GITLAB_RUNNER_TAG}

run:
  stage: run
  before_script:
    - echo "Logging into AWS ECR"
    - echo "$AWS_ACCESS_KEY_ID" | aws configure set aws_access_key_id -
    - echo "$AWS_SECRET_ACCESS_KEY" | aws configure set aws_secret_access_key -
    - aws ecr get-login-password --region ap-southeast-1 | docker login --username AWS --password-stdin ${DOMAIN_REGISTRY}
  script:
    - pwd
    - whoami
    - echo "Pulling Docker image from ECR"
    - docker pull ${IMAGE_NAME}
    - docker compose -f docker-compose.yml up -d
  only:
    - tags
  tags:
    - ${GITLAB_RUNNER_TAG}
